name: Keep Backend Alive

on:
  schedule:
    # Every 14 minutes — beats Render's 15-min inactivity sleep timer.
    # GitHub cron is best-effort and may drift a few minutes, so the
    # 1-minute buffer is intentional.
    - cron: '*/14 * * * *'
  workflow_dispatch: # Allow manual trigger for testing

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping backend health endpoint
        run: |
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 120 \
            "${{ secrets.BACKEND_HEALTH_URL }}")
          echo "Health check returned: $RESPONSE"
          if [ "$RESPONSE" -ne 200 ]; then
            echo "::warning::Backend returned $RESPONSE"
          fi
